<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-transparent">

    <!-- ============================================
         FLOATING CHATBOT WIDGET
         ============================================ -->
    <div id="chat-widget" class="fixed bottom-5 right-5 z-50">

        <!-- TOGGLE BUTTON -->
        <button id="chat-toggle" 
                class="w-16 h-16 rounded-full bg-gradient-to-br from-[#E07B39] to-[#C86A2F] text-white shadow-2xl flex items-center justify-center hover:scale-110 transition-transform duration-300 relative"
                onclick="toggleChat()">
            <svg viewBox="0 0 100 100" class="w-10 h-10">
                <circle cx="50" cy="50" r="40" fill="#FFF5E6"/>
                <path d="M 15 40 Q 15 10 50 10 Q 85 10 85 40 Q 75 25 50 22 Q 25 25 15 40 Z" fill="#3E2723"/>
                <circle cx="35" cy="48" r="4" fill="#333"/>
                <circle cx="65" cy="48" r="4" fill="#333"/>
                <circle cx="36" cy="47" r="1.5" fill="#FFF"/>
                <circle cx="66" cy="47" r="1.5" fill="#FFF"/>
                <path d="M 30 62 Q 50 82 70 62" stroke="#333" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <circle cx="25" cy="58" r="5" fill="#FFB6B6" opacity="0.7"/>
                <circle cx="75" cy="58" r="5" fill="#FFB6B6" opacity="0.7"/>
            </svg>
            <span class="absolute top-1 right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></span>
        </button>

        <!-- CHAT WINDOW -->
        <div id="chat-window" 
             class="hidden absolute bottom-20 right-0 w-96 h-[500px] bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-[#F0D9C1]"
             style="animation: slideUp 0.3s ease-out;">

            <!-- HEADER -->
            <div class="bg-gradient-to-r from-[#E07B39] to-[#C86A2F] text-white p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-white/25 flex items-center justify-center">
                        <svg viewBox="0 0 100 100" class="w-7 h-7">
                            <circle cx="50" cy="50" r="40" fill="#FFF5E6"/>
                            <path d="M 15 40 Q 15 10 50 10 Q 85 10 85 40 Q 75 25 50 22 Q 25 25 15 40 Z" fill="#3E2723"/>
                            <circle cx="35" cy="48" r="4" fill="#333"/>
                            <circle cx="65" cy="48" r="4" fill="#333"/>
                            <path d="M 30 62 Q 50 82 70 62" stroke="#333" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div>
                        <div class="font-bold text-sm">Cafeteria Assistant</div>
                        <div class="text-xs flex items-center gap-1">
                            <span class="w-1.5 h-1.5 bg-green-400 rounded-full"></span>
                            Online
                        </div>
                    </div>
                </div>
                <button onclick="toggleChat()" class="text-white hover:bg-white/20 rounded-full p-1.5 transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- MESSAGES -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[#FAF0E6]">
                <div class="text-center text-sm text-[#3E2723] bg-white border border-[#F0D9C1] rounded-2xl rounded-bl-sm p-3 max-w-[85%]">
                    👋 Hello! I'm your Cafeteria Assistant.<br>
                    Ask me about our menu, prices, or anything else!
                </div>
            </div>

            <!-- INPUT -->
            <form id="chat-form" class="p-3 bg-white border-t border-[#F0D9C1] flex gap-2">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Type your message..."
                    class="flex-1 px-4 py-2 bg-[#FFFBF5] border border-[#E8D4BE] rounded-full text-sm focus:outline-none focus:border-[#E07B39]"
                    autocomplete="off">
                <button type="submit" 
                        class="w-10 h-10 bg-gradient-to-r from-[#E07B39] to-[#C86A2F] text-white rounded-full flex items-center justify-center hover:opacity-90 transition">
                    <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- ============================================
         STYLES
         ============================================ -->
    <style>
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #chat-messages::-webkit-scrollbar { width: 6px; }
        #chat-messages::-webkit-scrollbar-track { background: transparent; }
        #chat-messages::-webkit-scrollbar-thumb { background: #E8D4BE; border-radius: 3px; }
    </style>

    <!-- ============================================
         CHAT LOGIC
         ============================================ -->
    <script>
    let chatHistory = [];

    function toggleChat() {
        const win = document.getElementById('chat-window');
        win.classList.toggle('hidden');
        if (!win.classList.contains('hidden')) {
            setTimeout(() => document.getElementById('user-input').focus(), 100);
        }
    }

    function addMessage(text, who) {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div');

        if (who === 'user') {
            div.className = 'ml-auto text-sm text-white bg-gradient-to-r from-[#E07B39] to-[#C86A2F] rounded-2xl rounded-br-sm p-3 max-w-[85%]';
            div.textContent = text;
        } else {
            div.className = 'text-sm text-[#3E2723] bg-white border border-[#F0D9C1] rounded-2xl rounded-bl-sm p-3 max-w-[85%]';
            div.innerHTML = text.replace(/\n/g, '<br>');
        }
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function showTyping() {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.id = 'typing';
        div.className = 'text-sm text-[#3E2723] bg-white border border-[#F0D9C1] rounded-2xl rounded-bl-sm p-3 max-w-[60px] flex gap-1';
        div.innerHTML = '<span class="w-2 h-2 bg-[#C86A2F] rounded-full animate-bounce"></span><span class="w-2 h-2 bg-[#C86A2F] rounded-full animate-bounce" style="animation-delay:0.1s"></span><span class="w-2 h-2 bg-[#C86A2F] rounded-full animate-bounce" style="animation-delay:0.2s"></span>';
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typing');
        if (el) el.remove();
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('user-input');
        const msg = input.value.trim();
        if (!msg) return;

        addMessage(msg, 'user');
        chatHistory.push({ role: 'user', content: msg });
        input.value = '';
        showTyping();

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg, history: chatHistory })
            });

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let botText = '';

            hideTyping();
            const box = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'text-sm text-[#3E2723] bg-white border border-[#F0D9C1] rounded-2xl rounded-bl-sm p-3 max-w-[85%]';
            box.appendChild(div);

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                botText += decoder.decode(value);
                div.innerHTML = botText.replace(/\n/g, '<br>');
                box.scrollTop = box.scrollHeight;
            }

            chatHistory.push({ role: 'assistant', content: botText });

        } catch (err) {
            hideTyping();
            addMessage('Sorry, network error. Please try again.', 'bot');
        }
    });
    </script>

</body>
</html>
